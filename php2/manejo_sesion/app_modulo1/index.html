<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de Pagos (CRUD protegido)</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script defer src="./js/script.js"></script>
</head>
<body>
  <header>Gestión de Pagos – Módulo Protegido (Sesión)</header>

  <section id="botonera">
    <button id="btCargar">Cargar datos</button>
    <button class="vaciar" id="btVaciar">Vaciar tabla</button>
    <button id="btAlta">Alta registro</button>
    <button class="neutro" id="btCerrarSesion" onclick="location.href='../destruirSesion.php'">Cerrar sesión</button>
  </section>

  <main>
    <table>
      <thead>
        <tr>
          <th>ID Operación</th>
          <th>DNI</th>
          <th>Deudor</th>
          <th>Cuota</th>
          <th>Importe</th>
          <th>Medio</th>
          <th>Comprobante</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tbodyDatos">
        <tr><td colspan="8">Sin datos cargados</td></tr>
      </tbody>
    </table>

    <div id="pie">
      <div id="totalRegistros">Total: 0</div>
      <div id="estado"></div>
    </div>
  </main>

  <!-- Modal ALTA -->
  <div class="modal" id="modalAlta">
    <div class="card">
      <h3>Alta de Movimiento</h3>
      <div class="form-grid">
        <label>ID Operación
          <input id="a_id" maxlength="4" />
        </label>
        <label>DNI Deudor
          <input id="a_dni" maxlength="8" />
        </label>
        <label>Nombre del Deudor
          <input id="a_nom" />
        </label>
        <label>N° Cuota
          <input id="a_cuo" type="number" min="1" />
        </label>
        <label>Importe
          <input id="a_imp" type="number" step="0.01" min="0" />
        </label>
        <label>Medio de pago
          <select id="a_med"></select>
        </label>
        <label>Comprobante (archivo/imagen)
          <input id="a_qr" placeholder="comp_0020.png" />
        </label>
      </div>
      <div class="acciones">
        <button class="neutro" id="a_cancel">Cancelar</button>
        <button id="a_enviar">Guardar</button>
      </div>
      <div id="a_estado"></div>
    </div>
  </div>

  <!-- Modal MODI -->
  <div class="modal" id="modalModi">
    <div class="card">
      <h3>Modificación de Movimiento</h3>
      <div class="form-grid">
        <label>ID Operación (no editable)
          <input id="m_id" maxlength="4" readonly />
        </label>
        <label>DNI Deudor
          <input id="m_dni" maxlength="8" />
        </label>
        <label>Nombre del Deudor
          <input id="m_nom" />
        </label>
        <label>N° Cuota
          <input id="m_cuo" type="number" min="1" />
        </label>
        <label>Importe
          <input id="m_imp" type="number" step="0.01" min="0" />
        </label>
        <label>Medio de pago
          <select id="m_med"></select>
        </label>
        <label>Comprobante (archivo/imagen)
          <input id="m_qr" />
        </label>
      </div>
      <div class="acciones">
        <button class="neutro" id="m_cancel">Cancelar</button>
        <button id="m_enviar">Guardar cambios</button>
      </div>
      <div id="m_estado"></div>
    </div>
  </div>
</body>
</html>
